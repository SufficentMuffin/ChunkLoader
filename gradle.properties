org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Point this at your JDK 21 install if Gradle picks up the wrong Java version.
# Example (Windows): org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.x.x-hotspot
#org.gradle.java.home=

# Fabric Properties - verified against maven.fabricmc.net and fabricmc.net's
# official 1.21.11 blog post at time of writing (Sept 2026). 1.21.11 is the
# LAST Minecraft version using Yarn mappings - Fabric has stated Yarn will
# not be updated further. If a while has passed, double-check these against
# https://fabricmc.net/develop/ before relying on them for anything newer.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.1

# Mod Properties
mod_version=1.0.0
maven_group=com.example.chunkloader
archives_base_name=chunkloader

# Fabric API for the server-only command/tick redesign.
fabric_api_version=0.135.1+1.21.11
